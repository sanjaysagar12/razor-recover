<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Razorpay AI Revenue Recovery -- Customer Conversations</title>
<style>
  :root {
    --bg: #0f1420; --panel: #161d2e; --panel2: #1c2438; --border: #2a334a;
    --text: #e6e9f0; --text-dim: #9aa4bd; --accent: #5b8cff;
    --green: #34c98f; --amber: #e8b13b; --red: #ef5a6f; --purple: #b085f5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 -apple-system, Segoe UI, Roboto, sans-serif;
    height: 100vh; display: flex; flex-direction: column;
  }
  header {
    padding: 16px 24px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
  }
  h1 { font-size: 18px; margin: 0; }
  .sub { color: var(--text-dim); font-size: 12px; }
  header a { color: var(--accent); text-decoration: none; font-weight: 600; font-size: 13px; }
  .header-controls { display: flex; align-items: center; gap: 16px; }
  .danger-btn {
    background: transparent; border: 1px solid var(--red); color: var(--red);
    border-radius: 8px; padding: 5px 12px; cursor: pointer; font-size: 12px; font-weight: 600;
  }
  .danger-btn:hover { background: rgba(239,90,111,.12); }
  .danger-btn:disabled { opacity: .5; cursor: not-allowed; }

  .layout { flex: 1; display: flex; min-height: 0; }

  .sidebar {
    width: 320px; min-width: 260px; border-right: 1px solid var(--border);
    display: flex; flex-direction: column; background: var(--panel);
  }
  .sidebar-header { padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .sidebar-header h2 { font-size: 12px; margin: 0 0 10px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-dim); }
  #customerSearch {
    width: 100%; background: #0b0f19; color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 10px; font: inherit; font-size: 13px;
  }
  #customerList { flex: 1; overflow-y: auto; }
  .customer-row {
    padding: 12px 16px; border-bottom: 1px solid #1e2637; cursor: pointer;
  }
  .customer-row:hover { background: var(--panel2); }
  .customer-row.active { background: var(--panel2); border-left: 3px solid var(--accent); }
  .customer-row .email { font-weight: 600; font-size: 13px; word-break: break-all; }
  .customer-row .meta { color: var(--text-dim); font-size: 11px; margin-top: 4px; }

  .main { flex: 1; overflow-y: auto; padding: 20px 28px; min-width: 0; }
  .empty { color: var(--text-dim); padding: 40px; text-align: center; }

  .case-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 18px; margin-bottom: 20px;
  }
  .case-card .chead { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .case-card .chead h3 { margin: 0; font-size: 14px; }
  .case-card .chead .sub { margin-top: 2px; }

  .outcome-banner {
    border-radius: 8px; padding: 8px 12px; font-size: 12.5px; font-weight: 600; margin-bottom: 14px;
  }
  .outcome-banner.scheduled { background: rgba(52,201,143,.15); color: var(--green); border: 1px solid rgba(52,201,143,.3); }
  .outcome-banner.fallback { background: rgba(232,177,59,.15); color: var(--amber); border: 1px solid rgba(232,177,59,.3); }
  .outcome-banner.awaiting { background: rgba(154,164,189,.12); color: var(--text-dim); border: 1px solid var(--border); }
  .outcome-banner.review { background: rgba(239,90,111,.15); color: var(--red); border: 1px solid rgba(239,90,111,.3); }

  .opening-message {
    background: #12182a; border: 1px solid var(--border); border-left: 3px solid var(--accent);
    border-radius: 8px; padding: 12px 14px; margin-bottom: 14px; font-size: 13px; line-height: 1.55;
  }
  .opening-message .envelope-label {
    font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-dim); margin-bottom: 6px;
  }
  .opening-message .subject { font-weight: 700; margin-bottom: 8px; }
  .opening-message .body { color: var(--text); white-space: pre-wrap; }

  .thread { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
  .bubble-row { display: flex; }
  .bubble-row.customer { justify-content: flex-end; }
  .bubble-row.system { justify-content: flex-start; }
  .bubble {
    max-width: 70%; padding: 9px 13px; border-radius: 12px; font-size: 13px; line-height: 1.5;
  }
  .bubble .meta { font-size: 10.5px; opacity: .7; margin-top: 4px; }
  .bubble-row.customer .bubble { background: var(--accent); color: #fff; border-bottom-right-radius: 3px; }
  .bubble-row.system .bubble { background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-bottom-left-radius: 3px; }

  .reply-row { display: flex; gap: 8px; margin-top: 6px; }
  .chat-input {
    flex: 1; background: #0b0f19; color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 10px; font: inherit;
  }
  button.primary {
    background: var(--accent); border: none; color: #fff; border-radius: 8px;
    padding: 8px 16px; cursor: pointer; font-weight: 600;
  }
  button.primary:hover { filter: brightness(1.1); }
  button.primary:disabled { opacity: .5; cursor: not-allowed; }
  .reply-status { font-size: 12px; margin-top: 6px; color: var(--text-dim); }

  #toasts { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 50; }
  .toast {
    background: var(--panel2); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px;
    max-width: 340px; box-shadow: 0 8px 24px rgba(0,0,0,.4);
  }
  .toast.ok { border-left: 4px solid var(--green); }
  .toast.warn { border-left: 4px solid var(--amber); }
  .toast.err { border-left: 4px solid var(--red); }
  .toast .t { font-weight: 700; font-size: 12px; margin-bottom: 4px; }
  .toast .m { font-size: 12px; color: var(--text-dim); }
</style>
</head>
<body>

<header>
  <div>
    <h1>Customer Conversations</h1>
    <div class="sub">Full promise-to-pay reply threads, grouped by customer email</div>
  </div>
  <div class="header-controls">
    <button class="danger-btn" id="resetConversationsBtn" title="Clears the customer directory, promise threads, and promise_log.csv">Reset conversations</button>
    <a href="/dashboard">&larr; Back to Dashboard</a>
  </div>
</header>

<div class="layout">
  <div class="sidebar">
    <div class="sidebar-header">
      <h2>Customers</h2>
      <input type="text" id="customerSearch" placeholder="Search by email or case_id...">
    </div>
    <div id="customerList"></div>
  </div>
  <div class="main" id="main">
    <div class="empty">Select a customer on the left to view their conversation history.</div>
  </div>
</div>

<div id="toasts"></div>

<script>
// -- API fetch / toast / escape helpers -- same shape as dashboard/index.html --
async function apiFetch(path, options) {
  return fetch(path, options || {});
}

function toast(kind, title, msg) {
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.innerHTML = `<div class="t">${escapeHtml(title)}</div><div class="m">${escapeHtml(msg)}</div>`;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => el.remove(), 7000);
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// -- State ------------------------------------------------------------
let customers = [];
let selectedEmail = null;

// -- Customer list ------------------------------------------------------------
async function refreshCustomerList() {
  const resp = await apiFetch('/api/customers');
  const data = await resp.json();
  customers = data.customers || [];
  renderCustomerList();
}

function matchingCaseId(customer, filter) {
  return (customer.case_ids || []).find(id => id.toLowerCase().includes(filter));
}

function renderCustomerList() {
  const filter = document.getElementById('customerSearch').value.trim().toLowerCase();
  const listEl = document.getElementById('customerList');
  // Matches either the email or any of the customer's case_ids -- lets an
  // operator paste a case_id (e.g. copied from the main dashboard's Audit
  // Log) and jump straight to the customer who owns it, without already
  // knowing their email.
  const filtered = filter
    ? customers.filter(c => c.email.toLowerCase().includes(filter) || matchingCaseId(c, filter))
    : customers;

  if (!filtered.length) {
    listEl.innerHTML = '<div class="empty">No customers found.</div>';
    return;
  }

  listEl.innerHTML = filtered.map(c => {
    const active = c.email === selectedEmail ? ' active' : '';
    const lastActivity = c.last_activity ? new Date(c.last_activity).toLocaleString() : '--';
    const matchedCaseId = filter ? matchingCaseId(c, filter) : null;
    return `<div class="customer-row${active}" data-email="${escapeHtml(c.email)}" onclick="selectCustomer(this.dataset.email)">
      <div class="email">${escapeHtml(c.email)}</div>
      <div class="meta">${c.case_count} case${c.case_count === 1 ? '' : 's'} &middot; last active ${escapeHtml(lastActivity)}</div>
      ${matchedCaseId ? `<div class="meta" style="color:var(--accent)">matched case_id: ${escapeHtml(matchedCaseId)}</div>` : ''}
    </div>`;
  }).join('');
}

document.getElementById('customerSearch').addEventListener('input', renderCustomerList);

// -- Conversation thread rendering ------------------------------------------------------------
function outcomeBanner(promise) {
  const o = promise.scheduled_outcome || {};
  if (o.kind === 'scheduled') {
    return `<div class="outcome-banner scheduled">Scheduled for: ${escapeHtml(o.scheduled_for)}</div>`;
  }
  if (o.kind === 'fallback') {
    return `<div class="outcome-banner fallback">Fallback: automatic scheduling, scheduled ${escapeHtml(o.scheduled_for)}</div>`;
  }
  if (o.kind === 'requires_human_review') {
    return `<div class="outcome-banner review">Flagged for human review (guardrail_status=${escapeHtml(promise.guardrail_status) || 'n/a'})</div>`;
  }
  if (o.kind === 'reschedule_failed') {
    return `<div class="outcome-banner review">Guardrail approved (date ${escapeHtml(o.extracted_date) || '--'}) but scheduling failed -- Razorpay API error</div>`;
  }
  return `<div class="outcome-banner awaiting">Awaiting reply</div>`;
}

function systemBubbleForPromise(promise) {
  if (promise.status === 'clarifying') {
    return `Could you clarify -- I couldn't quite pin down a date from that message. (clarification round ${promise.clarification_round})`;
  }
  if (promise.status === 'fallback') {
    return `No clear reply after multiple attempts -- falling back to an automatic schedule${promise.extracted_date ? ' for ' + promise.extracted_date : ''}.`;
  }
  if (promise.status === 'scheduled') {
    return `Got it -- payment reminder scheduled for ${escapeHtml(promise.extracted_date)}.`;
  }
  if (promise.status === 'requires_human_review') {
    return `This reply needs a human to review it before scheduling anything.`;
  }
  if (promise.outcome === 'reschedule_failed') {
    return `Guardrail approved this reply, but creating the payment link failed (Razorpay API error) -- not scheduled.`;
  }
  if (promise.guardrail_status && promise.guardrail_status !== 'approved') {
    return `Guardrail verdict: ${escapeHtml(promise.guardrail_status)} -- not auto-scheduled.`;
  }
  return `Reply received, still processing.`;
}

function renderThread(promises) {
  if (!promises.length) {
    return '<div class="sub" style="padding:8px 0">No replies yet for this case.</div>';
  }
  return '<div class="thread">' + promises.map(p => `
    <div class="bubble-row customer">
      <div class="bubble">
        ${escapeHtml(p.message)}
        <div class="meta">${escapeHtml(new Date(p.created_at).toLocaleString())}${p.extraction_confidence != null ? ' &middot; confidence ' + p.extraction_confidence : ''}</div>
      </div>
    </div>
    <div class="bubble-row system">
      <div class="bubble">${systemBubbleForPromise(p)}</div>
    </div>
  `).join('') + '</div>';
}

// -- Opening message -- a read-only, email-styled preview of the outreach
// that started this conversation. There is no real outbound messaging
// channel anywhere in this app (see README_WEBHOOK.md) -- this is display
// only, templated from the case's own audit-row fields (amount,
// decline_code, ptp_trigger_category), not something actually sent. Wording
// branches on hard_decline specifically (pipeline/ptp_trigger.py's
// permanent "payment method itself won't work" verdict) vs. everything
// else, matching the same distinction _is_conversation_worthy_case already
// uses server-side to decide whether a case belongs on this page at all. --
function formatAmount(amount) {
  const n = Number(amount);
  return Number.isFinite(n) ? n.toFixed(2) : (amount ?? 'the amount');
}

function buildOpeningMessage(summary) {
  const amount = formatAmount(summary.amount);
  const declineCode = summary.decline_code ? summary.decline_code.replace(/_/g, ' ') : 'a technical issue';

  if (summary.ptp_trigger_category === 'hard_decline') {
    return {
      subject: 'Action needed: update your payment method',
      body: `Hi,\n\nWe tried to process your payment of ₹${amount} but it didn't go through -- your payment method was declined (${declineCode}). This isn't something we can fix by retrying.\n\nCould you update your payment method so we can complete this?\n\nThanks,\nRecovery Team`,
    };
  }
  return {
    subject: 'Action needed on your recent payment',
    body: `Hi,\n\nYour payment of ₹${amount} didn't go through (${declineCode}). When would you like us to retry?\n\nThanks,\nRecovery Team`,
  };
}

function renderOpeningMessage(summary) {
  if (!summary) return '';
  const { subject, body } = buildOpeningMessage(summary);
  return `<div class="opening-message">
    <div class="envelope-label">Outreach sent to customer</div>
    <div class="subject">${escapeHtml(subject)}</div>
    <div class="body">${escapeHtml(body)}</div>
  </div>`;
}

function renderCaseCard(caseEntry) {
  const summary = caseEntry.case_summary || {};
  const promises = caseEntry.promises || [];
  const latest = promises.length ? promises[promises.length - 1] : null;
  const customerId = summary.customer_key || ('case:' + caseEntry.case_id);

  return `<div class="case-card" data-case-id="${escapeHtml(caseEntry.case_id)}">
    <div class="chead">
      <div>
        <h3>${escapeHtml(caseEntry.case_id)}</h3>
        <div class="sub">${summary.timestamp ? escapeHtml(new Date(summary.timestamp).toLocaleString()) : ''}${summary.decline_code ? ' &middot; ' + escapeHtml(summary.decline_code) : ''}${summary.amount != null ? ' &middot; amount ' + escapeHtml(summary.amount) : ''}</div>
      </div>
    </div>
    ${renderOpeningMessage(summary)}
    ${latest ? outcomeBanner(latest) : ''}
    ${renderThread(promises)}
    <div class="reply-row">
      <input type="text" class="chat-input" placeholder="Reply as this customer..."
        onkeydown="if(event.key==='Enter'){this.nextElementSibling.click();}">
      <button class="primary" data-case-id="${escapeHtml(caseEntry.case_id)}" data-customer-id="${escapeHtml(customerId)}"
        onclick="sendReplyFromCard(this)">Send</button>
    </div>
    <div class="reply-status"></div>
  </div>`;
}

function renderMain(data) {
  const mainEl = document.getElementById('main');
  if (!data.cases || !data.cases.length) {
    mainEl.innerHTML = `<div class="empty">No cases found for ${escapeHtml(data.email)}.</div>`;
    return;
  }
  mainEl.innerHTML = data.cases.map(renderCaseCard).join('');
}

async function selectCustomer(email) {
  selectedEmail = email;
  renderCustomerList();
  const mainEl = document.getElementById('main');
  mainEl.innerHTML = '<div class="empty">Loading...</div>';
  try {
    const resp = await apiFetch('/api/customer/' + encodeURIComponent(email) + '/conversations');
    const data = await resp.json();
    if (!resp.ok) {
      mainEl.innerHTML = `<div class="empty">${escapeHtml(data.message || 'Not found')}</div>`;
      return;
    }
    renderMain(data);
  } catch (e) {
    mainEl.innerHTML = `<div class="empty">Error loading conversations: ${escapeHtml(String(e))}</div>`;
  }
}

// -- Sending a reply -- reuses the same /api/promise-reply endpoint the main
// dashboard's case-detail modal uses, but re-fetches and re-renders the full
// thread afterward instead of showing a one-line status. --------------------
async function sendReplyFromCard(btn) {
  const caseId = btn.dataset.caseId;
  const customerId = btn.dataset.customerId;
  const card = btn.closest('.case-card');
  const input = card.querySelector('.chat-input');
  const statusEl = card.querySelector('.reply-status');
  const message = input.value;

  if (!message.trim()) {
    statusEl.textContent = 'Type a message first.';
    statusEl.style.color = 'var(--amber)';
    return;
  }

  btn.disabled = true;
  input.disabled = true;
  statusEl.textContent = 'Sending...';
  statusEl.style.color = 'var(--text-dim)';
  try {
    const resp = await apiFetch('/api/promise-reply', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ case_id: caseId, customer_id: customerId, message }),
    });
    const data = await resp.json();
    if (!resp.ok) {
      toast('err', 'Reply failed', data.message || resp.statusText);
      statusEl.textContent = '';
      btn.disabled = false;
      input.disabled = false;
      return;
    }
    input.value = '';
    toast('ok', 'Reply sent', `case ${caseId}`);
    // Refetch and re-render the full thread instead of a one-line status.
    await selectCustomer(selectedEmail);
    await refreshCustomerList();
  } catch (e) {
    toast('err', 'Reply error', String(e));
    statusEl.textContent = '';
    btn.disabled = false;
    input.disabled = false;
  }
}

// -- Reset conversations ------------------------------------------------------------
document.getElementById('resetConversationsBtn').addEventListener('click', async () => {
  if (!confirm('Clear the customer directory, all promise-reply threads, and promise_log.csv? '
    + 'This does not touch customer_history scoring data or the audit log. This cannot be undone.')) {
    return;
  }

  const btn = document.getElementById('resetConversationsBtn');
  btn.disabled = true;
  try {
    const resp = await apiFetch('/api/reset-conversations', { method: 'POST' });
    const data = await resp.json();
    if (!resp.ok) {
      toast('err', 'Reset failed', data.message || resp.statusText);
    } else {
      toast('ok', 'Conversations reset', 'Cleared: ' + (data.cleared || []).join(', '));
      selectedEmail = null;
      document.getElementById('main').innerHTML = '<div class="empty">Select a customer on the left to view their conversation history.</div>';
      await refreshCustomerList();
    }
  } catch (e) {
    toast('err', 'Reset error', String(e));
  } finally {
    btn.disabled = false;
  }
});

// -- Init ------------------------------------------------------------
refreshCustomerList();
</script>

</body>
</html>
